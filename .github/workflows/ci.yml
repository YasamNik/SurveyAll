name: CI
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: surveyall, POSTGRES_PASSWORD: surveyall, POSTGRES_DB: surveyall }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U surveyall" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      DATABASE_URL: postgres://surveyall:surveyall@localhost:5433/surveyall
      IP_HASH_SALT: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: corepack enable pnpm
      - run: corepack prepare pnpm@9.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm build
